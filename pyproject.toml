[project]
name = "demandwise"
version = "1.2.0"
description = "Food-demand forecasting platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Hitesh", email = "hites@example.com"}
]
keywords = ["forecasting", "streamlit", "machine learning", "food demand"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "streamlit>=1.30",
    "plotly>=5.0",
    "PyYAML>=6.0",
    "joblib>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[project.optional-dependencies]
tensorflow = ["tensorflow>=2.12"]
shap = ["shap>=0.42"]
dev = ["pytest>=7.0", "ruff>=0.4.0", "mypy>=1.0"]

[project.urls]
Homepage = "https://github.com/example/demandwise"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "W", "C90"]
ignore = ["E501"]